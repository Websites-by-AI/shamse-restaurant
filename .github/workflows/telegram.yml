name: Telegram bot (شمسه)

# ربات @shamse_restaurant_bot
#   ۱) پاسخ خودکار به پیام‌های مستقیم هر ۳۰ دقیقه (/menu /events /reserve ...)
#   ۲) پست خودکار به کانال، سه‌شنبه/چهارشنبه/جمعه ساعت ۰۹:۰۰ UTC (= ۱۲:۰۰ استانبول)
#      متن پست با هوش مصنوعی (GitHub Models با توکن مخزن) و در صورت نبود آن با قالب آماده
#      نوشته می‌شود؛ هرگز بدون تأیید موتور جایگزین، پست نمی‌ماند.
#
# پیش‌نیاز: Secret با نام TELEGRAM_BOT_TOKEN
# اختیاری:  Variable با نام TELEGRAM_CHAT_ID (@username یا شناسهٔ عددی کانال)
#           اگر ثبت نشود، ربات کانال را خودش از آپدیت‌ها پیدا و در automation/state.json نگه می‌دارد.

on:
  schedule:
    - cron: '*/15 * * * *'      # پاسخ به پیام‌ها (پنجرهٔ long-poll هر ۱۵ دقیقه)
    - cron: '0 9 * * 1,3,5'     # پست به کانال
    - cron: '15 */6 * * *'      # اخبار و فراخوان‌های مرتبط (هر ۶ ساعت)
    - cron: '0 6 * * *'         # یادآور رویدادهای فردا (۰۹:۰۰ استانبول)
  workflow_dispatch:
    inputs:
      mode:
        description: 'حالت اجرا'
        type: choice
        default: post
        options: [post, poll, selftest, discover, brand, news, remind, report, broadcast]
      dry_run:
        description: 'بدون ارسال واقعی (فقط نمایش)'
        type: boolean
        default: false
      text:
        description: 'متن پیام گروهی (فقط برای حالت broadcast)'
        type: string
        default: ''

permissions:
  contents: write
  models: read

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: بررسی سلامت ربات
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'selftest'
        env: &bot_env
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 automation/telegram_bot.py selftest

      - name: کشف کانال
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover'
        env: *bot_env
        run: python3 automation/telegram_bot.py discover

      - name: برندینگ کانال (عنوان، توضیحات، پست راهنمای سنجاق‌شده)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'brand'
        env: *bot_env
        run: python3 automation/telegram_bot.py brand

      - name: یادآور رویدادهای فردا
        if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'remind')
        env: *bot_env
        run: python3 automation/telegram_bot.py remind

      - name: گزارش وضعیت ربات
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'report'
        env: *bot_env
        run: python3 automation/telegram_bot.py report

      - name: پیام گروهی به کاربران
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'broadcast'
        env: *bot_env
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 automation/telegram_bot.py broadcast --text "${{ inputs.text }}" --dry-run
          else
            python3 automation/telegram_bot.py broadcast --text "${{ inputs.text }}"
          fi

      - name: اخبار و فراخوان‌های مرتبط (دیتابیس + هوش مصنوعی)
        if: (github.event_name == 'schedule' && github.event.schedule == '15 */6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'news')
        env: *bot_env
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 automation/news.py --dry-run
          else
            python3 automation/news.py
          fi

      - name: پاسخ به پیام‌های مستقیم (long-poll برای پاسخ آنی)
        if: (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'poll')
        env: *bot_env
        run: python3 automation/telegram_bot.py poll --loop 9

      - name: پست خودکار به کانال
        if: (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1,3,5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'post')
        env: *bot_env
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 automation/telegram_bot.py post --dry-run --force
          else
            python3 automation/telegram_bot.py post
          fi

      - name: ثبت وضعیت ربات
        if: always()
        run: |
          git config user.name "shamse-bot"
          git config user.email "shamse-bot@users.noreply.github.com"
          git add automation/state.json automation/news_db.json automation/bot_db.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no state changes"; exit 0; }
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "chore(bot): update state [skip ci]"
          # other bot runs may have pushed in the meantime -> rebase and retry
          for i in 1 2 3; do
            if git push; then echo "state pushed"; exit 0; fi
            echo "push rejected — rebasing (attempt $i)"
            git pull --rebase --autostash origin main || true
          done
          echo "could not push state (non-fatal)"; exit 0
